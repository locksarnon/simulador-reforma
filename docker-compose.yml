services:
  postgres:
    image: postgres:16-alpine
    container_name: reforma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - reforma_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Docker Hub (minio/minio) pode negar pull — use o registry oficial.
    image: quay.io/minio/minio:latest
    container_name: reforma-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9200:9000"
      - "9201:9001"
    volumes:
      - reforma_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reforma-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3003
      API_PREFIX: api/v1
      CORS_ORIGINS: http://localhost:5175,http://127.0.0.1:5175,https://simulador.clarityib.com.br
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: xml-uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      INVITE_CODE: ${INVITE_CODE:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
    ports:
      - "3003:3003"
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default
      - traefik-net
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.middlewares.reforma-api-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.reforma-api-http.entrypoints: web
      traefik.http.routers.reforma-api-http.rule: "Host(`simulador.clarityib.com.br`) && PathPrefix(`/api`)"
      traefik.http.routers.reforma-api-http.middlewares: reforma-api-https-redirect
      traefik.http.routers.reforma-api.entrypoints: websecure
      traefik.http.routers.reforma-api.rule: "Host(`simulador.clarityib.com.br`) && PathPrefix(`/api`)"
      traefik.http.routers.reforma-api.tls: "true"
      traefik.http.routers.reforma-api.tls.certresolver: myresolver
      traefik.http.routers.reforma-api.priority: "100"
      traefik.http.services.reforma-api.loadbalancer.server.port: "3003"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: reforma-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://simulador.clarityib.com.br/api/v1}
    ports:
      - "5175:5175"
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5175/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default
      - traefik-net
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.middlewares.reforma-web-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.reforma-web-http.entrypoints: web
      traefik.http.routers.reforma-web-http.rule: "Host(`simulador.clarityib.com.br`)"
      traefik.http.routers.reforma-web-http.middlewares: reforma-web-https-redirect
      traefik.http.routers.reforma-web.entrypoints: websecure
      traefik.http.routers.reforma-web.rule: "Host(`simulador.clarityib.com.br`)"
      traefik.http.routers.reforma-web.tls: "true"
      traefik.http.routers.reforma-web.tls.certresolver: myresolver
      traefik.http.services.reforma-web.loadbalancer.server.port: "5175"

networks:
  traefik-net:
    external: true

volumes:
  reforma_pg_data:
  reforma_minio_data:
