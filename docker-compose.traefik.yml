# Deploy no VPS Clarity (Traefik + TLS).
# Código no VPS: /var/www/html/simulador-reforma
# Requer Docker Compose ≥ 2.24 (`ports: !override`).
# Uso no servidor (rede externa `traefik-net` já existente):
#   git pull
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml --env-file .env up -d --build
# NÃO use este overlay no notebook. NÃO recrie o .env num ambiente que já roda.
#
# Domínio: https://intax.clarityib.com.br (o antigo simulador.clarityib.com.br redireciona para ele)
# Guia: docs/deploy/UPDATE.md  |  Erros: docs/deploy/TROUBLESHOOTING.md

services:
  backend:
    ports: !override []
    environment:
      CORS_ORIGINS: https://intax.clarityib.com.br,http://intax.clarityib.com.br
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - traefik.http.routers.simulador-api.rule=Host(`intax.clarityib.com.br`) && PathPrefix(`/api`)
      - traefik.http.routers.simulador-api.entrypoints=websecure
      - traefik.http.routers.simulador-api.tls.certresolver=myresolver
      - traefik.http.routers.simulador-api.priority=100
      - traefik.http.services.simulador-api.loadbalancer.server.port=3003
      # O compose base também define reforma-api; cada roteador precisa do serviço explícito.
      - traefik.http.routers.simulador-api.service=simulador-api
      - traefik.http.routers.reforma-api.service=reforma-api
      - traefik.http.routers.reforma-api-http.service=reforma-api
    networks:
      - default
      - traefik-net

  frontend:
    ports: !override []
    # Produção serve o build otimizado (vite preview), não o servidor de
    # desenvolvimento. Se o build falhar, cai no modo dev para o site não sair
    # do ar — e o erro aparece em `docker logs reforma-frontend`.
    command: ["sh", "-c", "npm run build && exec npm run preview || exec npm run dev"]
    healthcheck:
      start_period: 120s
    environment:
      VITE_API_URL: https://intax.clarityib.com.br/api/v1
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      - traefik.http.routers.simulador-web.rule=Host(`intax.clarityib.com.br`)
      - traefik.http.routers.simulador-web.entrypoints=websecure
      - traefik.http.routers.simulador-web.tls.certresolver=myresolver
      - traefik.http.routers.simulador-web.priority=1
      - traefik.http.services.simulador-web.loadbalancer.server.port=5175
      - traefik.http.routers.simulador-web.service=simulador-web
      - traefik.http.routers.simulador-web-http.service=simulador-web
      - traefik.http.routers.reforma-web.service=reforma-web
      - traefik.http.routers.reforma-web-http.service=reforma-web
      - traefik.http.routers.simulador-web-http.rule=Host(`intax.clarityib.com.br`)
      - traefik.http.routers.simulador-web-http.entrypoints=web
      - traefik.http.routers.simulador-web-http.middlewares=simulador-https-redirect
      - traefik.http.middlewares.simulador-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.simulador-https-redirect.redirectscheme.permanent=true
      # Domínio antigo: tudo (site e API, http e https) vai para o mesmo caminho no domínio novo,
      # para não quebrar links de e-mails já enviados e favoritos. Prioridade acima da API (100).
      - traefik.http.routers.intax-dominio-antigo.rule=Host(`simulador.clarityib.com.br`)
      - traefik.http.routers.intax-dominio-antigo.entrypoints=websecure
      - traefik.http.routers.intax-dominio-antigo.tls.certresolver=myresolver
      - traefik.http.routers.intax-dominio-antigo.priority=200
      - traefik.http.routers.intax-dominio-antigo.middlewares=intax-dominio-antigo-redirect
      - traefik.http.routers.intax-dominio-antigo.service=simulador-web
      - traefik.http.routers.intax-dominio-antigo-http.rule=Host(`simulador.clarityib.com.br`)
      - traefik.http.routers.intax-dominio-antigo-http.entrypoints=web
      - traefik.http.routers.intax-dominio-antigo-http.priority=200
      - traefik.http.routers.intax-dominio-antigo-http.middlewares=intax-dominio-antigo-redirect
      - traefik.http.routers.intax-dominio-antigo-http.service=simulador-web
      - traefik.http.middlewares.intax-dominio-antigo-redirect.redirectregex.regex=^https?://simulador\.clarityib\.com\.br/(.*)
      - traefik.http.middlewares.intax-dominio-antigo-redirect.redirectregex.replacement=https://intax.clarityib.com.br/$${1}
      - traefik.http.middlewares.intax-dominio-antigo-redirect.redirectregex.permanent=true
    networks:
      - default
      - traefik-net

networks:
  traefik-net:
    external: true
