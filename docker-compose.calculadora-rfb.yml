# Calculadora oficial da Receita (CBS/IBS/IS) ao lado do backend, só na rede interna (a API deles não tem autenticação).
# Entra em todo deploy junto com os outros arquivos: -f docker-compose.calculadora-rfb.yml
services:
  calculadora-rfb:
    build:
      context: ./calculadora-rfb
      args:
        RFB_COMMIT: ${CALCULADORA_RFB_COMMIT:-150cccb}
    container_name: reforma-calculadora-rfb
    restart: unless-stopped
    mem_limit: 768m
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - calculadora_rfb_dados:/compartilhado
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/calculadora/dados-abertos/versao HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  backend:
    environment:
      CALCULADORA_RFB_URL: http://reforma-calculadora-rfb:8080/api/calculadora
    volumes:
      - calculadora_rfb_dados:/calculadora-rfb:ro
      - calculadora_rfb_controle:/calculadora-rfb-controle

volumes:
  calculadora_rfb_dados:
  calculadora_rfb_controle:
